name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL3_VERSION: "3.4.18"
  FFMPEG_VERSION: "7.1.1"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-x11-dev \
            libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-static-${{ runner.os }}-${{ env.SDL3_VERSION }}-v1

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ env.FFMPEG_VERSION }}-v1

      - name: Build SDL3 (shared)
        run: ./packaging/build-sdl3.sh "$RUNNER_TEMP/sdl3" shared

      - name: Build FFmpeg (static, audio only)
        run: ./packaging/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" \
            -DFFMPEG_ROOT="$RUNNER_TEMP/ffmpeg"

      - name: Build
        run: cmake --build build

      - name: Smoke test (offscreen)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            LINAMP_SCREENSHOT="$RUNNER_TEMP/shot.bmp" ./build/linamp
          test -s "$RUNNER_TEMP/shot.bmp"

      - name: Package AppImage
        run: |
          set -euo pipefail
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          install -m755 build/linamp "$APPDIR/usr/bin/linamp"
          strip --strip-unneeded "$APPDIR/usr/bin/linamp"
          # SDL3 is the only shared dependency we ship (it dlopen()s the
          # Wayland/X11/ALSA/PulseAudio of the host at runtime).
          mkdir -p "$APPDIR/usr/lib"
          cp -a "$RUNNER_TEMP"/sdl3/lib/libSDL3.so* "$APPDIR/usr/lib/"
          install -m644 packaging/linamp.desktop "$APPDIR/usr/share/applications/linamp.desktop"
          install -m644 packaging/linamp.desktop "$APPDIR/linamp.desktop"
          install -m644 assets/icon.png "$APPDIR/linamp.png"
          install -m644 assets/icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/linamp.png"
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/linamp" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$APPDIR" linamp-linux-x86_64.AppImage

          ls -lh linamp-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linamp-linux-x86_64
          path: linamp-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/linamp.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            make tar xz curl

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: C:\sdl3-static
          key: sdl3-static-win-${{ env.SDL3_VERSION }}-v1

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: C:\ffmpeg-static
          key: ffmpeg-static-win-${{ env.FFMPEG_VERSION }}-v1

      - name: Build SDL3 (static)
        shell: msys2 {0}
        run: ./packaging/build-sdl3.sh /c/sdl3-static static

      - name: Build FFmpeg (static, audio only)
        shell: msys2 {0}
        run: ./packaging/build-ffmpeg.sh /c/ffmpeg-static

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m /c/sdl3-static)" \
            -DFFMPEG_ROOT="$(cygpath -m /c/ffmpeg-static)"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Smoke test (offscreen)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:LINAMP_SCREENSHOT = "$env:RUNNER_TEMP\shot.bmp"
          & .\build\linamp.exe
          if (!(Test-Path $env:LINAMP_SCREENSHOT)) { throw "offscreen render failed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\linamp.exe dist\
          Copy-Item README.md dist\
          Copy-Item CHANGELOG.md dist\
          Compress-Archive -Path dist\* -DestinationPath linamp-windows-x64.zip -Force
          Get-Item linamp-windows-x64.zip | Select-Object Length

      - uses: actions/upload-artifact@v4
        with:
          name: linamp-windows-x64
          path: linamp-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-static-${{ runner.os }}-${{ env.SDL3_VERSION }}-v1

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ env.FFMPEG_VERSION }}-v1

      - name: Build SDL3 (static)
        run: ./packaging/build-sdl3.sh "$RUNNER_TEMP/sdl3"

      - name: Build FFmpeg (static, audio only)
        run: ./packaging/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      - name: Generate application icon
        run: |
          set -euo pipefail
          mkdir -p Linamp.iconset
          for spec in \
            "16 icon_16x16" "32 icon_16x16@2x" \
            "32 icon_32x32" "64 icon_32x32@2x" \
            "128 icon_128x128" "256 icon_128x128@2x" \
            "256 icon_256x256" "512 icon_256x256@2x" \
            "512 icon_512x512" "1024 icon_512x512@2x"; do
            set -- $spec
            sips -z "$1" "$1" assets/icon.png --out "Linamp.iconset/$2.png" >/dev/null
          done
          iconutil -c icns Linamp.iconset -o assets/linamp.icns

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" \
            -DFFMPEG_ROOT="$RUNNER_TEMP/ffmpeg" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build

      - name: Smoke test (offscreen)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            LINAMP_SCREENSHOT="$RUNNER_TEMP/shot.bmp" build/Linamp.app/Contents/MacOS/Linamp
          test -s "$RUNNER_TEMP/shot.bmp"

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Linamp.app"
          # Ad-hoc signature: users may need to right-click -> Open on first launch.
          # Replace with a Developer ID certificate + notarization for a fully trusted build.
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname "Linamp" -srcfolder "$APP" -ov -format UDZO linamp-macos-arm64.dmg
          ls -lh linamp-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: linamp-macos-arm64
          path: linamp-macos-arm64.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          du -h *

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## Linamp ${{ github.ref_name }}

            Native Winamp 2.x-style music player — C++ / SDL3 + FFmpeg, no Qt.
            Fan-made homage, not affiliated with Winamp/Nullsoft.

            | Platform | File | Notes |
            | --- | --- | --- |
            | Linux x86_64 | `linamp-linux-x86_64.AppImage` | ±3.5 MB, self-contained; taruh window rule Hyprland kalau mau selalu floating |
            | Windows x64 | `linamp-windows-x64.zip` | Ekstrak lalu jalankan `linamp.exe` (butuh `SDL3.dll` di folder yang sama) |
            | macOS arm64 (Apple Silicon) | `linamp-macos-arm64.dmg` | Ad-hoc signed; klik kanan → Open jika Gatekeeper menolak |

            Checksums: `SHA256SUMS.txt`.

            ### Catatan
            - Windows/macOS belum code-signed/notarized; peringatan SmartScreen/Gatekeeper mungkin muncul.
            - AppImage sekarang ±3,5 MB: FFmpeg dan SDL di-link statis, hanya codec audio yang ikut.
            - Playlist, layout panel, EQ dan volume tersimpan di `~/.config/linamp/state.json`.
